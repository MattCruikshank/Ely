<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ely Splat</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cellipse cx=%228%22 cy=%228%22 rx=%227%22 ry=%224%22 fill=%22%237cc4ff%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="loading">
      <div class="label">Loading splat… <span id="pct">0%</span></div>
      <div class="bar"><div id="fill"></div></div>
    </div>

    <div id="hud">
      <button id="play" title="Fly the original video camera path (P)">▶ Play path</button>
      <button id="reset" title="Back to the first video frame (R)">⟲ Reset</button>
      <button id="help-toggle" title="Controls (H)">?</button>
    </div>

    <div id="help" hidden>
      <b>Controls</b>
      <div>Drag: look around</div>
      <div>Right-drag / two-finger: slide</div>
      <div>W A S D: move · Q E: down / up</div>
      <div>Shift: faster · Scroll: forward / back</div>
      <div>P: play path · R: reset · H: help</div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
